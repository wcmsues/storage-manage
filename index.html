<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="动力二组库房管理系统：备件台账、出入库登记与共享包，数据只存本机。">
<meta name="theme-color" content="#007AFF">
<title>动力二组库房管理系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Cpath d='M24 22v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2' fill='none' stroke='%23007AFF' stroke-width='4' stroke-linecap='round'/%3E%3Crect x='12' y='22' width='40' height='26' rx='6' fill='none' stroke='%23007AFF' stroke-width='4'/%3E%3Cpath d='M12 33h40' stroke='%23007AFF' stroke-width='4'/%3E%3Crect x='27' y='29.5' width='10' height='7' rx='2' fill='%23007AFF'/%3E%3C/svg%3E">
<style>
:root{
  --bg-page:#F5F5F7; --bg-elevated:#FFFFFF;
  --bg-fill:rgba(120,120,128,.12); --bg-fill-2:rgba(120,120,128,.08);
  --label-1:#1D1D1F; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.36);
  --separator:rgba(60,60,67,.12); --separator-light:rgba(60,60,67,.07);
  --blue:#007AFF; --blue-tint:rgba(0,122,255,.10);
  --red:#FF3B30; --red-tint:rgba(255,59,48,.10);
  --orange:#FF9500; --orange-tint:rgba(255,149,0,.12);
  --green:#34C759; --green-tint:rgba(52,199,89,.13);
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-card:14px; --r-sheet:20px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px;
  --dur-fast:150ms; --dur-base:200ms; --dur-sheet:320ms;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg-page:#000000; --bg-elevated:#1C1C1E;
    --bg-fill:rgba(120,120,128,.24); --bg-fill-2:rgba(120,120,128,.16);
    --label-1:#F5F5F7; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3);
    --separator:rgba(84,84,88,.6); --separator-light:rgba(84,84,88,.4);
    --blue:#0A84FF; --blue-tint:rgba(10,132,255,.16);
    --red:#FF453A; --red-tint:rgba(255,69,58,.15);
    --orange:#FF9F0A; --orange-tint:rgba(255,159,10,.15);
    --green:#30D158; --green-tint:rgba(48,209,88,.15);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg-page); color:var(--label-1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" on,"lnum" on; font-variant-numeric:tabular-nums;
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- 布局骨架 ---------- */
.sidebar{display:none}
.topnav{display:none}
.tabbar{display:none}
.main{min-height:100vh}
#view{max-width:1440px;margin:0 auto;padding:16px 16px calc(140px + env(safe-area-inset-bottom))}
body.is-gate .sidebar,body.is-gate .topnav,body.is-gate .tabbar{display:none!important}
body.is-gate .main{margin-left:0}
body.is-gate #view{padding:0;max-width:none}

@media (min-width:1024px){
  .sidebar{
    display:flex;flex-direction:column;gap:var(--space-4);
    position:fixed;inset:0 auto 0 0;width:232px;z-index:40;
    background:var(--bg-elevated);border-right:0.5px solid var(--separator-light);
    padding:20px 12px;
  }
  .main{margin-left:232px}
  #view{padding:20px 24px 22px}
  .tabbar{display:none}
}
@media (min-width:768px) and (max-width:1023px){
  .topnav{
    display:flex;gap:4px;position:sticky;top:0;z-index:40;
    background:var(--bg-elevated);border-bottom:0.5px solid var(--separator-light);
    padding:6px 16px;
  }
  .topnav .nav-item{flex-direction:row;gap:6px;height:40px;padding:0 14px;border-radius:var(--r-md);width:auto}
  .topnav .nav-item span{font-size:13px}
  #view{padding:20px 20px 28px}
}
@media (max-width:767px){
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--bg-elevated);border-top:0.5px solid var(--separator-light);
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
}

/* 品牌 */
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 0}
.logo{width:34px;height:34px;flex:none;border-radius:9px}
.brand-text{min-width:0}
.brand-name{font-size:14px;font-weight:500;line-height:1.3;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--label-2);white-space:nowrap}

/* 导航 */
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  min-height:44px;padding:0 10px;border-radius:var(--r-md);
  color:var(--label-1);font-size:13px;text-align:left;
  transition:background var(--dur-fast) ease-out;
}
.nav-item svg{width:20px;height:20px;flex:none;color:var(--label-2)}
.nav-item:hover{background:var(--bg-fill-2)}
.nav-item[aria-current="page"]{background:var(--bg-fill);font-weight:500}
.nav-item[aria-current="page"] svg{color:var(--blue)}
@media (min-width:768px) and (max-width:1023px){
  .topnav .nav-item{justify-content:center}
}
@media (max-width:767px){
  .tabbar .nav-item{
    flex:1;flex-direction:column;justify-content:center;gap:2px;
    height:48px;padding:0;border-radius:0;font-size:10px;text-align:center;
  }
  .tabbar .nav-item svg{width:22px;height:22px}
  .tabbar .nav-item[aria-current="page"]{background:none}
}
.sidebar-foot{margin-top:auto;padding:0 8px 4px}
.mode-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--label-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--label-3)}
.dot-blue{background:var(--blue)}

/* ---------- 页面 ---------- */
.page{display:flex;flex-direction:column;gap:var(--space-4)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-actions{display:flex;align-items:center;gap:8px}
.page-title h1{font-size:22px;font-weight:500;letter-spacing:-.6px;line-height:1.25}
.page-title .sub{margin-top:2px;font-size:12px;color:var(--label-2)}
@media (max-width:767px){
  .page-title h1{font-size:34px;letter-spacing:-1.2px}
  .page-title .sub{font-size:13px}
  .page-head{align-items:center}
  .page-actions .btn-primary{
    position:fixed;left:16px;right:16px;z-index:35;
    bottom:calc(64px + env(safe-area-inset-bottom) + 12px);
    height:50px;border-radius:var(--r-card);
  }
}

/* ---------- 卡片 ---------- */
.card{
  background:var(--bg-elevated);border:0.5px solid var(--separator-light);
  border-radius:var(--r-lg);padding:14px 16px;
}
.card-title{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.card-title .count{font-size:11px;font-weight:400;color:var(--label-3)}
.card-foot{margin-top:12px}
.card-note{margin-top:8px;font-size:12px;color:var(--label-2)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:1280px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{
  background:var(--bg-elevated);border:0.5px solid var(--separator-light);
  border-radius:var(--r-lg);padding:14px 16px;
}
.kpi-label{font-size:12px;color:var(--label-2)}
.kpi-value{font-size:28px;font-weight:500;letter-spacing:-1px;line-height:1.1;margin-top:4px}
.kpi-unit{font-size:12px;color:var(--label-3);margin-left:2px}

/* ---------- 工具条 ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px}
.search-wrap{position:relative;flex:1 1 240px;max-width:360px;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:10px;width:16px;height:16px;color:var(--label-3);pointer-events:none}
.input{
  width:100%;height:36px;padding:0 12px;border-radius:var(--r-md);
  background:var(--bg-elevated);border:0.5px solid var(--separator);color:var(--label-1);
  font-size:13px;transition:border-color var(--dur-fast) ease-out;
}
.input.search{padding-left:32px}
.input::placeholder{color:var(--label-3)}
select.input{appearance:none;-webkit-appearance:none;padding-right:36px}
.select-wrap{position:relative;display:inline-flex;flex:0 0 auto;min-width:128px}
.select-wrap select.input{width:100%}
.select-wrap::after{
  content:"";position:absolute;right:15px;top:50%;
  width:7px;height:7px;margin-top:-4px;
  border-right:1.5px solid var(--label-3);border-bottom:1.5px solid var(--label-3);
  transform:rotate(45deg);pointer-events:none;
}
@media (max-width:767px){
  .input{height:44px;font-size:15px}
  .search-wrap{flex:1 1 100%;max-width:none}
  .search-wrap svg{left:12px}
  .select-wrap{min-width:0;max-width:calc(50% - 5px)}
  .select-wrap::after{right:16px;width:8px;height:8px;margin-top:-5px}
  .field .select-wrap{max-width:100%}
}

/* chips */
#ledgerBody{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{
  display:inline-flex;align-items:center;height:26px;padding:0 10px;
  border-radius:var(--r-sm);background:var(--blue-tint);color:var(--blue);font-size:12px;
}
.chip-clear{font-size:12px;color:var(--blue);min-height:32px;padding:0 4px}
@media (max-width:767px){.chip-clear{min-height:44px}}

/* ---------- 表格 ---------- */
.table-card{padding:0;overflow:hidden}
.table{width:100%;table-layout:fixed;border-collapse:collapse}
.table th{
  font-size:11px;font-weight:400;color:var(--label-3);text-align:left;
  padding:10px 16px;border-bottom:0.5px solid var(--separator-light);white-space:nowrap;
}
.table td{
  font-size:12.5px;padding:11px 16px;height:44px;
  border-bottom:0.5px solid var(--separator-light);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.table tbody tr:last-child td{border-bottom:0}
.table .num{text-align:right}
.table tr[data-act]{cursor:pointer;transition:background var(--dur-fast) ease-out}
.table tr[data-act]:hover td,.table tr[data-act]:focus-visible td{background:var(--bg-fill-2)}
.cell-main{font-size:12.5px}
.cell-sub{font-size:11px;color:var(--label-2)}
.qty{font-size:12.5px}
.unit{font-size:11px;color:var(--label-3);margin-left:2px;white-space:nowrap}

/* ---------- 徽章 ---------- */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:var(--r-sm);font-size:11px;line-height:1.4;white-space:nowrap}
.badge.ok{background:var(--green-tint);color:#1C8C3B}
.badge.bad{background:var(--red-tint);color:#C4342B}
.badge.info{background:var(--blue-tint);color:var(--blue)}
.badge.mute{background:var(--bg-fill);color:var(--label-2)}
@media (prefers-color-scheme: dark){
  .badge.ok{color:#30D158}
  .badge.bad{color:#FF6961}
}

/* ---------- 手机卡片列表 ---------- */
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--bg-elevated);border:0.5px solid var(--separator-light);
  border-radius:var(--r-card);padding:14px 16px;
}
.mcard[data-act]{cursor:pointer;transition:background var(--dur-fast) ease-out}
.mcard[data-act]:active{background:var(--bg-fill-2)}
.mcard-main{flex:1;min-width:0}
.mcard-title{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard-sub{margin-top:2px;font-size:13px;color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard-note{margin-top:2px;font-size:12px;color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.mcard-qty{font-size:20px;font-weight:500;letter-spacing:-.4px;line-height:1.2;white-space:nowrap}
.mcard-balance{font-size:12px;color:var(--label-2);white-space:nowrap}
.mcard-act{position:relative;margin-left:10px;font-size:12px;color:var(--blue);line-height:1.5;padding:0 2px}
.mcard-act::after{content:"";position:absolute;inset:-10px -8px}
.mcard-flag{margin-left:8px;font-size:11px;color:var(--label-3)}
@media (min-width:768px){.mlist{display:none}}
@media (max-width:767px){.table-card{display:none}}

/* ---------- 空状态 ---------- */
.empty{
  background:var(--bg-elevated);border:0.5px solid var(--separator-light);
  border-radius:var(--r-lg);padding:36px 20px;text-align:center;
}
.empty p{font-size:13px;color:var(--label-2);margin-bottom:14px}
.empty .btn{display:inline-flex}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:32px;padding:0 14px;border-radius:var(--r-md);
  font-size:13px;font-weight:500;white-space:nowrap;
  border:0.5px solid transparent;transition:background var(--dur-fast) ease-out;
}
.btn-primary{background:var(--blue);color:#FFFFFF}
.btn-primary:hover{filter:brightness(1.06)}
.btn-secondary{background:var(--bg-elevated);border-color:var(--separator);color:var(--label-1)}
.btn-secondary:hover{background:var(--bg-fill-2)}
.btn-ghost{background:var(--bg-fill);color:var(--label-1)}
.btn-ghost:hover{background:var(--bg-fill-2)}
.btn-danger{background:var(--red);color:#FFFFFF}
.btn-text{color:var(--blue);padding:0 4px}
.btn-sm{height:28px;font-size:12px;padding:0 10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media (max-width:767px){
  .btn{height:44px;font-size:15px;border-radius:var(--r-md)}
  .btn-primary{height:50px;border-radius:var(--r-card)}
  .btn-sm{height:36px;font-size:13px}
  .btn-text{height:44px}
}

/* ---------- 设置行 ---------- */
.row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 0;border-bottom:0.5px solid var(--separator-light);
}
.row:last-child{border-bottom:0;padding-bottom:0}
.row:first-of-type{padding-top:12px}
.row-main{min-width:0;flex:1}
.row-title{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:12px;color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub.wrap{white-space:normal;line-height:1.45}
.row-note{font-size:11px;color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-actions{display:flex;gap:4px;flex:none}
.danger-text{color:var(--red)}

/* ---------- 只读来源条 ---------- */
.banner{
  display:flex;align-items:center;gap:8px;
  background:var(--blue-tint);border-radius:10px;padding:5px 6px 5px 10px;
  margin-bottom:12px;font-size:12px;line-height:1.4;color:var(--label-1);
}
.banner .banner-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner b{font-weight:500}
.banner .btn-sm{flex:none;height:28px;padding:0 10px;font-size:12px}

/* ---------- 弹层 ---------- */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.32);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fade var(--dur-base) var(--ease);
}
.modal{
  width:min(520px,100%);max-height:86vh;overflow:auto;
  background:var(--bg-elevated);border-radius:var(--r-lg);padding:20px;
  animation:pop var(--dur-base) var(--ease);
}
.modal-title{font-size:17px;font-weight:500;letter-spacing:-.3px;margin-bottom:12px}
.modal-body{font-size:13px;color:var(--label-1)}
.modal-body p{color:var(--label-2);margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.grabber{display:none}
body.modal-open{overflow:hidden}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:767px){
  .modal-backdrop{align-items:flex-end;padding:0}
  .modal{
    width:100%;max-height:92vh;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
    border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  }
  .grabber{display:block;width:36px;height:5px;border-radius:3px;background:var(--bg-fill);margin:6px auto 12px}
  .modal-actions{margin-top:16px}
  .modal-actions .btn{flex:1}
  .modal-title{font-size:20px;letter-spacing:-.4px}
}

/* ---------- 详情抽屉 ---------- */
.modal-backdrop.is-drawer{align-items:stretch;justify-content:flex-end;padding:0}
.modal-drawer{
  width:min(440px,100%);height:100%;max-height:none;
  border-radius:var(--r-lg) 0 0 var(--r-lg);
  animation:slide-in var(--dur-base) var(--ease);
}
@keyframes slide-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media (min-width:768px) and (max-width:1023px){.modal-drawer{width:60%}}
@media (max-width:767px){
  .modal-backdrop.is-drawer{align-items:flex-end}
  .modal-drawer{width:100%;height:auto;max-height:92vh;border-radius:var(--r-sheet) var(--r-sheet) 0 0}
}
.detail-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:0.5px solid var(--separator-light)}
.detail-name{font-size:17px;font-weight:500;letter-spacing:-.3px;line-height:1.3;word-break:break-word}
.detail-sub{margin-top:2px;font-size:12px;color:var(--label-2);word-break:break-word}
.detail-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.detail-qty{font-size:24px;font-weight:500;letter-spacing:-.8px;line-height:1.1;white-space:nowrap}
.detail-qty .unit{font-size:12px;margin-left:2px}
.detail-rows{padding:2px 0}
.drow{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:0.5px solid var(--separator-light);font-size:13px}
.drow:last-child{border-bottom:0}
.drow-label{color:var(--label-2);flex:none}
.drow-value{text-align:right;min-width:0;word-break:break-word}
.detail-section{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 2px;font-size:13px;font-weight:500}
.detail-section .btn-text{font-size:12px;font-weight:400;padding:0 4px}
.dlog{padding:9px 0;border-bottom:0.5px solid var(--separator-light)}
.dlog:last-child{border-bottom:0}
.dlog-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px}
.dlog-sub{font-size:11px;color:var(--label-2);margin-top:2px}
.dlog-note{font-size:12px;color:var(--label-2);margin-top:2px;word-break:break-word}
.dlog-empty{font-size:12px;color:var(--label-2);padding:10px 0}

/* ---------- 表单 ---------- */
.field{margin-bottom:14px}
.field:last-of-type{margin-bottom:0}
.field label{display:block;font-size:12px;color:var(--label-2);margin-bottom:6px}
.field .input{height:40px}
.field textarea.input{height:auto;min-height:72px;padding:10px 12px;line-height:1.5;resize:vertical}
.field .hint{font-size:11px;color:var(--label-2);margin-top:6px}
.field .readonly-value{font-size:15px;padding:8px 0}
.field .select-wrap{display:flex;width:100%;max-width:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:767px){
  .field .input{height:44px}
  .grid2{grid-template-columns:1fr;gap:0}

<noscript><p style="padding:24px;font-size:14px">本系统需要启用 JavaScript 才能使用。</p></noscript>

<script>
"use strict";

/* =========================================================
   常量与基础状态
   ========================================================= */
const APP_VERSION = "0.6.0";
const KEYS = {
  data: "spare.warehouse.v2",
  pin: "spare.warehouse.pin.v2",
  bak: "spare.warehouse.bak.v1",
  admin: "admin"
};
const NAV = [
  { id: "ledger", label: "台账", icon: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="13" height="13" rx="2.5"/><path d="M6.5 8h7M6.5 12h4.5"/></svg>' },
  { id: "log", label: "登记", icon: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12.5V4.5m0 0L4.5 7M7 4.5 9.5 7M13 7.5v8m0 0 2.5-2.5M13 15.5 10.5 13"/></svg>' },
  { id: "logs", label: "明细", icon: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="4" y="2.5" width="12" height="15" rx="2"/><path d="M7 7h6M7 10h6M7 13h4"/></svg>' },
  { id: "settings", label: "设置", icon: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="2.5"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5.2 5.2l1.4 1.4M13.4 13.4l1.4 1.4M14.8 5.2l-1.4 1.4M6.6 13.4l-1.4 1.4"/></svg>' }
];
const UNIT_PRESET = ["个", "节", "片", "支", "米"];

let data = null;
const ui = {
  view: "ledger", q: "", wh: "", cat: "",
  regPart: "", regType: "in",
  logQ: "", logType: "", logWh: "", logFrom: "", logTo: "", logPart: "", logLimit: 0
};
const collator = new Intl.Collator("zh-Hans-CN", { numeric: true, sensitivity: "base" });

/* =========================================================
   工具函数
   ========================================================= */
function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function uid(prefix) {
  return (prefix || "id") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function n(v) {
  return Number(v || 0).toLocaleString("zh-CN");
}
function toInt(v, fallback) {
  const x = Math.floor(Number(v));
  return Number.isFinite(x) ? x : (fallback == null ? 0 : fallback);
}
function pad2(v) { return String(v).padStart(2, "0"); }
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function fmtClock(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function relFrom(ts) {
  const diff = Date.now() - ts.getTime();
  if (!isFinite(diff) || diff < 0) return "";
  const min = Math.floor(diff / 60000);
  if (min < 1) return "刚刚";
  if (min < 60) return min + " 分钟前";
  const hours = Math.floor(min / 60);
  if (hours < 24) return hours + " 小时前";
  const days = Math.floor(hours / 24);
  if (days < 7) return days + " 天前";
  return "";
}
function logTimeText(log, forTitle) {
  const clock = fmtClock(log.createdAt);
  if (!log.date) return clock || "—";
  const full = log.date + (clock ? " " + clock : "");
  if (forTitle) return full;
  const ts = new Date(log.date + "T" + (clock || "00:00") + ":00");
  if (!isNaN(ts.getTime())) {
    const rel = relFrom(ts);
    if (rel) return rel;
  }
  const sameYear = log.date.slice(0, 4) === String(new Date().getFullYear());
  return (sameYear ? log.date.slice(5) : log.date) + (clock ? " " + clock : "");
}
function shortStamp(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "—";
  const sameYear = d.getFullYear() === new Date().getFullYear();
  const head = sameYear ? pad2(d.getMonth() + 1) + "-" + pad2(d.getDate())
    : d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  return head + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function fmtStamp(iso) {
  if (!iso) return "未知时间";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
/* =========================================================
   存储层
   ========================================================= */
function normalize(raw) {
  const src = raw && typeof raw === "object" ? raw : {};
  const qty = v => { const x = Math.floor(Number(v)); return Number.isFinite(x) && x > 0 ? x : 0; };
  return {
    version: 2,
    source: src.source && typeof src.source === "object" ? src.source : null,
    warehouses: (Array.isArray(src.warehouses) ? src.warehouses : []).map(w => ({
      id: String(w.id || uid("wh")),
      no: String(w.no || ""),
      name: String(w.name || ""),
      manager: String(w.manager || ""),
      phone: String(w.phone || ""),
      note: String(w.note || "")
    })),
    parts: (Array.isArray(src.parts) ? src.parts : []).map(p => ({
      id: String(p.id || uid("pt")),
      warehouseId: String(p.warehouseId || ""),
      name: String(p.name || ""),
      model: String(p.model || ""),
      category: String(p.category || ""),
      unit: String(p.unit || "个"),
      qty: qty(p.qty),
      note: String(p.note || "")
    })),
    logs: (Array.isArray(src.logs) ? src.logs : []).map(l => ({
      id: String(l.id || uid("lg")),
      partId: String(l.partId || ""),
      part: l.part && typeof l.part === "object" ? {
        name: String(l.part.name || ""),
        model: String(l.part.model || ""),
        unit: String(l.part.unit || ""),
        warehouseNo: String(l.part.warehouseNo || "")
      } : { name: "", model: "", unit: "", warehouseNo: "" },
      type: l.type === "out" ? "out" : "in",
      qty: qty(l.qty),
      balance: qty(l.balance),
      operator: String(l.operator || ""),
      date: String(l.date || ""),
      createdAt: String(l.createdAt || ""),
      kind: l.kind === "initial" || l.kind === "reversal" ? l.kind : "normal",
      reversalOf: String(l.reversalOf || ""),
      note: String(l.note || "")
    })),
    settings: {
      operator: String((src.settings && src.settings.operator) || ""),
      pageSize: toInt(src.settings && src.settings.pageSize, 20) || 20
    }
  };
}
function loadData() {
  try {
    const raw = localStorage.getItem(KEYS.data);
    if (!raw) return null;
    return normalize(JSON.parse(raw));
  } catch (e) {
    return null;
  }
}
function saveData() {
  try {
    localStorage.setItem(KEYS.data, JSON.stringify(data));
    return true;
  } catch (e) {
    toast("保存失败：本机存储不可用，请立即导出共享包备份", "error");
    return false;
  }
}
function getPin() { try { return localStorage.getItem(KEYS.pin) || ""; } catch (e) { return ""; } }
function setPin(pin) { try { localStorage.setItem(KEYS.pin, pin); } catch (e) { toast("PIN 保存失败", "error"); } }
function isAdmin() { try { return sessionStorage.getItem(KEYS.admin) === "1"; } catch (e) { return false; } }
function setAdmin(on) {
  try { on ? sessionStorage.setItem(KEYS.admin, "1") : sessionStorage.removeItem(KEYS.admin); } catch (e) {}
}
function assertWritable() {
  if (!isAdmin()) throw new Error("当前是只读模式，不能修改数据");
}
function hashExists() {
  try { return localStorage.getItem(KEYS.bak) !== null; } catch (e) { return false; }
}

/* =========================================================
   业务操作（所有写操作都经过 assertWritable）
   ========================================================= */
function warehouseById(id) { return data.warehouses.find(w => w.id === id) || null; }
function warehouseLabel(id) {
  const w = warehouseById(id);
  return w ? w.no + " · " + w.name : "库房已删除";
}
function partById(id) { return data.parts.find(p => p.id === id) || null; }

function addWarehouse(input) {
  assertWritable();
  const no = String(input.no || "").trim();
  const name = String(input.name || "").trim();
  if (!no) throw new Error("请填写库房号");
  if (!name) throw new Error("请填写库房名称");
  if (data.warehouses.some(w => w.no.toLowerCase() === no.toLowerCase())) throw new Error("库房号「" + no + "」已存在");
  const w = {
    id: uid("wh"), no, name,
    manager: String(input.manager || "").trim(),
    phone: String(input.phone || "").trim(),
    note: String(input.note || "").trim()
  };
  data.warehouses.push(w);
  saveData();
  return w;
}
function updateWarehouse(id, input) {
  assertWritable();
  const w = warehouseById(id);
  if (!w) throw new Error("库房不存在");
  const no = String(input.no || "").trim();
  const name = String(input.name || "").trim();
  if (!no) throw new Error("请填写库房号");
  if (!name) throw new Error("请填写库房名称");
  if (data.warehouses.some(x => x.id !== id && x.no.toLowerCase() === no.toLowerCase())) throw new Error("库房号「" + no + "」已存在");
  w.no = no; w.name = name;
  w.manager = String(input.manager || "").trim();
  w.phone = String(input.phone || "").trim();
  w.note = String(input.note || "").trim();
  saveData();
  return w;
}
function removeWarehouse(id) {
  assertWritable();
  const w = warehouseById(id);
  if (!w) throw new Error("库房不存在");
  const count = data.parts.filter(p => p.warehouseId === id).length;
  if (count > 0) throw new Error("该库房还有 " + count + " 项备件，先迁移或删除备件再删库房");
  data.warehouses = data.warehouses.filter(x => x.id !== id);
  saveData();
}

function createLog(part, type, qty, balance, operator, date, note, kind) {
  const w = warehouseById(part.warehouseId);
  const log = {
    id: uid("lg"),
    partId: part.id,
    part: { name: part.name, model: part.model, unit: part.unit, warehouseNo: w ? w.no : "" },
    type, qty, balance,
    operator: operator || data.settings.operator || "管理员",
    date: date || today(),
    createdAt: new Date().toISOString(),
    kind: kind || "normal",
    note: note || ""
  };
  data.logs.push(log);
  return log;
}

function addPart(input) {
  assertWritable();
  const warehouseId = String(input.warehouseId || "");
  const w = warehouseById(warehouseId);
  if (!w) throw new Error("请选择所属库房");
  const name = String(input.name || "").trim();
  if (!name) throw new Error("请填写备件名称");
  const model = String(input.model || "").trim();
  if (data.parts.some(p => p.warehouseId === warehouseId && p.name === name && p.model === model)) {
    throw new Error("该库房已有同名同型号备件，请改走入库");
  }
  const qty = toInt(input.qty, 0);
  if (qty < 0) throw new Error("初始数量不能为负数");
  const part = {
    id: uid("pt"),
    warehouseId,
    name, model,
    category: String(input.category || "").trim(),
    unit: String(input.unit || "个").trim() || "个",
    qty,
    note: String(input.note || "").trim()
  };
  data.parts.push(part);
  if (qty > 0) {
    createLog(part, "in", qty, qty, data.settings.operator, today(), "期初建账", "initial");
  }
  saveData();
  return part;
}

function updatePart(id, input) {
  assertWritable();
  const part = partById(id);
  if (!part) throw new Error("备件不存在");
  const name = String(input.name || "").trim();
  if (!name) throw new Error("请填写备件名称");
  const model = String(input.model || "").trim();
  const warehouseId = String(input.warehouseId || part.warehouseId);
  if (!warehouseById(warehouseId)) throw new Error("请选择所属库房");
  if (data.parts.some(p => p.id !== id && p.warehouseId === warehouseId && p.name === name && p.model === model)) {
    throw new Error("该库房已有同名同型号备件，请改走入库");
  }
  part.name = name;
  part.model = model;
  part.warehouseId = warehouseId;
  part.category = String(input.category || "").trim();
  part.unit = String(input.unit || "个").trim() || "个";
  part.note = String(input.note || "").trim();
  saveData();
  return part;
}

function removePart(id) {
  assertWritable();
  const part = partById(id);
  if (!part) throw new Error("备件不存在");
  if (part.qty > 0) throw new Error("库存还有 " + part.qty + "，先出库到 0 再删除");
  data.parts = data.parts.filter(p => p.id !== id);
  saveData();
}

function addStockLog(input) {
  assertWritable();
  const part = partById(String(input.partId || ""));
  if (!part) throw new Error("请选择备件");
  const type = input.type === "out" ? "out" : "in";
  const raw = Number(String(input.qty == null ? "" : input.qty).trim());
  if (!Number.isFinite(raw) || Math.floor(raw) !== raw) throw new Error("数量必须是大于 0 的整数");
  const qty = raw;
  if (qty <= 0) throw new Error("数量必须是大于 0 的整数");
  if (type === "out" && qty > part.qty) {
    throw new Error(part.qty > 0
      ? "库存不足：当前 " + part.qty + " " + part.unit + "，最多可出 " + part.qty + " " + part.unit
      : "当前库存为 0，请先入库再出库");
  }
  const date = String(input.date || "").trim();
  if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error("日期格式不正确");
  const balance = type === "in" ? part.qty + qty : part.qty - qty;
  const log = createLog(part, type, qty, balance, String(input.operator || "").trim(), date || today(), String(input.note || "").trim(), "normal");
  const before = part.qty;
  part.qty = balance;
  if (!saveData()) {
    part.qty = before;
    data.logs = data.logs.filter(l => l.id !== log.id);
    throw new Error("保存失败，本次登记未生效");
  }
  return log;
}

function findReversalOf(logId) {
  return data.logs.find(l => l.kind === "reversal" && l.reversalOf === logId) || null;
}

function reverseLog(logId) {
  assertWritable();
  const src = data.logs.find(l => l.id === logId);
  if (!src) throw new Error("明细不存在");
  if (src.kind === "reversal") throw new Error("冲正记录不能再冲正");
  if (findReversalOf(src.id)) throw new Error("这笔明细已经冲正过");
  const part = partById(src.partId);
  if (!part) throw new Error("备件已删除，无法冲正");
  const type = src.type === "in" ? "out" : "in";
  if (type === "out" && src.qty > part.qty) {
    throw new Error("库存不足，需先补入库（当前 " + part.qty + " " + part.unit + "）");
  }
  const balance = type === "in" ? part.qty + src.qty : part.qty - src.qty;
  const log = createLog(part, type, src.qty, balance, data.settings.operator, today(), "冲正 #" + src.id, "reversal");
  log.reversalOf = src.id;
  const before = part.qty;
  part.qty = balance;
  if (!saveData()) {
    part.qty = before;
    data.logs = data.logs.filter(l => l.id !== log.id);
    throw new Error("保存失败，冲正未生效");
  }
  return log;
}

/* =========================================================
   查询
   ========================================================= */
function sortedWarehouses() {
  return [...data.warehouses].sort((a, b) => collator.compare(a.no, b.no) || collator.compare(a.name, b.name));
}
function sortedParts() {
  return [...data.parts].sort((a, b) => {
    const wa = warehouseById(a.warehouseId), wb = warehouseById(b.warehouseId);
    return collator.compare(wa ? wa.no : "", wb ? wb.no : "") || collator.compare(a.name, b.name) || collator.compare(a.model, b.model);
  });
}
function filteredParts() {
  const q = ui.q.trim().toLowerCase();
  return sortedParts().filter(p => {
    if (ui.wh && p.warehouseId !== ui.wh) return false;
    if (ui.cat && p.category !== ui.cat) return false;
    if (!q) return true;
    const w = warehouseById(p.warehouseId) || { no: "", name: "" };
    return [p.name, p.model, p.category, p.note, p.unit, w.no, w.name].join(" ").toLowerCase().indexOf(q) >= 0;
  });
}
function categories() {
  const set = new Set();
  data.parts.forEach(p => { if (p.category) set.add(p.category); });
  return [...set].sort((a, b) => collator.compare(a, b));
}
function units() {

/* =========================================================
   Toast 与弹层
   ========================================================= */
function toast(message, kind) {
  const root = document.getElementById("toastRoot");
  const el = document.createElement("div");
  el.className = "toast" + (kind === "error" ? " error" : "");
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => { el.remove(); }, kind === "error" ? 4200 : 2600);
}

let escKeyHandler = null;
function closeModal() {
  const root = document.getElementById("modalRoot");
  root.innerHTML = "";
  document.body.classList.remove("modal-open");
  if (escKeyHandler) { document.removeEventListener("keydown", escKeyHandler); escKeyHandler = null; }
}
function openModal(cfg) {
  const root = document.getElementById("modalRoot");
  const actions = (cfg.actions || []).map((a, i) => {
    const cls = a.kind === "primary" ? "btn-primary" : a.kind === "danger" ? "btn-danger" : a.kind === "ghost" ? "btn-ghost" : "btn-secondary";
    return '<button type="button" class="btn ' + cls + '" data-modal-btn="' + i + '">' + esc(a.label) + "</button>";
  }).join("");
  root.innerHTML =
    '<div class="modal-backdrop' + (cfg.drawer ? " is-drawer" : "") + '" data-backdrop>' +
      '<div class="modal' + (cfg.drawer ? " modal-drawer" : "") + '" role="dialog" aria-modal="true" aria-label="' + esc(cfg.title) + '">' +
        '<div class="grabber" aria-hidden="true"></div>' +
        '<h2 class="modal-title">' + esc(cfg.title) + "</h2>" +
        '<div class="modal-body">' + (cfg.body || "") + "</div>" +
        (actions ? '<div class="modal-actions">' + actions + "</div>" : "") +
      "</div>" +
    "</div>";
  document.body.classList.add("modal-open");
  const backdrop = root.firstElementChild;
  const modalEl = backdrop.firstElementChild;

  (cfg.actions || []).forEach((a, i) => {
    const btn = modalEl.querySelector('[data-modal-btn="' + i + '"]');
    if (!btn) return;
    btn.addEventListener("click", () => {
      const keep = a.onClick ? a.onClick(modalEl) : false;
      if (!keep) closeModal();
    });
  });
  backdrop.addEventListener("click", e => { if (e.target === backdrop && !cfg.locked) closeModal(); });

  escKeyHandler = e => {
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key !== "Tab") return;
    const focusable = modalEl.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  document.addEventListener("keydown", escKeyHandler);

  const firstInput = modalEl.querySelector("input:not([type=hidden]), select, textarea, button");
  if (firstInput) firstInput.focus();
  if (cfg.onMount) cfg.onMount(modalEl);
  return modalEl;
}
function wireFileLabel(label) {
  if (!label) return;
  label.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      const input = label.querySelector('input[type="file"]');
      if (input) input.click();
    }
  });
}

/* =========================================================
   下载
   ========================================================= */
function downloadFile(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || "application/json") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function fileStamp() {
  const d = new Date();
  return "" + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "-" + pad2(d.getHours()) + pad2(d.getMinutes());
}
function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvText(rows) {
  return "\uFEFF" + rows.map(row => row.map(csvCell).join(",")).join("\r\n") + "\r\n";
}
function exportLedgerCsv() {
  if (!data.parts.length) return toast("台账还是空的，没有可导出的备件", "error");
  const rows = [["库房号", "库房名称", "备件名称", "品牌型号", "分类", "单位", "数量", "备注"]];
  sortedParts().forEach(p => {
    const w = warehouseById(p.warehouseId);
    rows.push([w ? w.no : "", w ? w.name : "", p.name, p.model, p.category, p.unit, p.qty, p.note]);
  });
  try {
    downloadFile("备件台账-" + fileStamp() + ".csv", csvText(rows), "text/csv");
    toast("台账 CSV 已导出（" + n(rows.length - 1) + " 项）");
  } catch (ex) {
    toast("导出失败：" + ex.message, "error");
  }
}
function logCsvTime(log) {
  const clock = fmtClock(log.createdAt);
  return String(log.date || "") + (clock ? " " + clock : "");
}
function exportLogsCsv(logs, scopeLabel) {
  const rows = [["时间", "类型", "备件名称", "品牌型号", "单位", "数量", "结存", "经办人", "库房号", "备注"]];
  logs.forEach(l => {
    rows.push([
      logCsvTime(l), l.type === "in" ? "入库" : "出库",
      logTitle(l), logModel(l), l.part.unit,
      l.qty, l.balance, l.operator, l.part.warehouseNo, l.note
    ]);
  });
  try {
    downloadFile("出入库明细-" + fileStamp() + ".csv", csvText(rows), "text/csv");
    toast(scopeLabel + " CSV 已导出（" + n(logs.length) + " 笔）");
  } catch (ex) {
    toast("导出失败：" + ex.message, "error");
  }
}
function openLogsCsvDialog() {
  const all = sortedLogs();
  if (!all.length) return toast("还没有出入库明细", "error");
  const filterOn = logFilterOn();
  if (!filterOn) return exportLogsCsv(all, "全部明细");
  const filtered = filteredLogs();
  if (!filtered.length) return toast("当前筛选没有记录，请调整条件后再导出", "error");
  openModal({
    title: "导出明细 CSV",
    body: '<p>当前筛选 ' + n(filtered.length) + " 笔，全部 " + n(all.length) + " 笔。文件为 UTF-8 CSV，可用 Excel 直接打开。</p>",
    actions: [
      { label: "导出全部", kind: "secondary", onClick: () => exportLogsCsv(all, "全部明细") },
      { label: "导出当前筛选", kind: "primary", onClick: () => exportLogsCsv(filtered, "当前筛选") }
    ]
  });
}
function buildPackage() {
  return {
    version: 2,
    exportedAt: new Date().toISOString(),
    exportedBy: data.settings.operator || "管理员",
    warehouses: data.warehouses,
    parts: data.parts,
    logs: data.logs,
    settings: data.settings
  };
}
function validatePackage(pkg) {
  if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) return "文件内容不是有效的共享包";
  if (Number(pkg.version) !== 2) return "共享包版本不匹配（需要 v2）";
  if (!Array.isArray(pkg.warehouses) || !Array.isArray(pkg.parts) || !Array.isArray(pkg.logs)) return "共享包缺少库房、台账或明细";
  for (const w of pkg.warehouses) {
    if (!w || typeof w.id !== "string" || typeof w.no !== "string") return "库房数据不完整";
  }
  for (const p of pkg.parts) {
    if (!p || typeof p.id !== "string" || typeof p.warehouseId !== "string" || typeof p.name !== "string") return "台账数据不完整";
  }
  for (const l of pkg.logs) {
    if (!l || typeof l.id !== "string" || (l.type !== "in" && l.type !== "out") || !l.part) return "明细数据不完整";
  }
  if (pkg.settings != null && typeof pkg.settings !== "object") return "设置数据不完整";
  return "";
}
function importPackage(pkg) {
  const err = validatePackage(pkg);
  if (err) throw new Error(err);
  try {
    const current = localStorage.getItem(KEYS.data);
    if (current) {
      localStorage.setItem(KEYS.bak, JSON.stringify({ savedAt: new Date().toISOString(), data: JSON.parse(current) }));
    }
  } catch (e) {}
  data = normalize({
    version: 2,
    source: {
      type: "shared",
      exportedBy: pkg.exportedBy || "未知",
      exportedAt: pkg.exportedAt || "",
      importedAt: new Date().toISOString()
    },
    warehouses: pkg.warehouses,
    parts: pkg.parts,
    logs: pkg.logs,
    settings: pkg.settings
  });
  if (!saveData()) throw new Error("共享包导入后保存失败，请检查本机存储");
}

function bindGate() {
  const form = document.getElementById("initForm");
  form.addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("initOperator").value.trim();
    const pin = document.getElementById("initPin").value;
    const pin2 = document.getElementById("initPin2").value;
    const err = document.getElementById("gateError");
    err.textContent = "";
    if (!name) { err.textContent = "请填写管理员姓名"; return; }
    if (!/^[0-9]{4}$/.test(pin)) { err.textContent = "PIN 必须是 4 位数字"; return; }
    if (pin !== pin2) { err.textContent = "两次输入的 PIN 不一致"; return; }
    data = normalize({ version: 2, source: null, warehouses: [], parts: [], logs: [], settings: { operator: name, pageSize: 20 } });
    if (!saveData()) { err.textContent = "保存失败：浏览器不允许写入本地存储"; data = null; return; }
    setPin(pin);
    setAdmin(true);
    render();
    toast("已建账，先新增一个库房");
  });

  const file = document.getElementById("gateFile");
  file.addEventListener("change", () => {
    const f = file.files && file.files[0];
    if (!f) return;
    const errBox = document.getElementById("gateFileError");
    errBox.textContent = "";
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const pkg = JSON.parse(String(reader.result));
        importPackage(pkg);
        setAdmin(false);
        render();
        toast("共享包已导入，当前为只读查看");
      } catch (ex) {
        errBox.textContent = ex.message || "共享包读取失败";
      }
    };
    reader.onerror = () => { errBox.textContent = "文件读取失败"; };
    reader.readAsText(f);
  });

  wireFileLabel(document.querySelector(".gate .file-btn"));
}

/* =========================================================
   页面：登记
   ========================================================= */
function partOptionsHTML(selectedId) {
  const groups = [];
  sortedParts().forEach(p => {
    const w = warehouseById(p.warehouseId);
    const key = w ? w.id : "__missing";
    let g = groups.find(x => x.key === key);
    if (!g) { g = { key, label: w ? w.no + " · " + w.name : "库房已删除", items: [] }; groups.push(g); }
    g.items.push(p);
  });
  return groups.map(g => '<optgroup label="' + esc(g.label) + '">' +
    g.items.map(p => '<option value="' + esc(p.id) + '"' + (p.id === selectedId ? " selected" : "") + ">" +
      esc(p.name) + (p.model ? " · " + esc(p.model) : "") + "</option>").join("") +
    "</optgroup>").join("");
}
function stockLineHTML(part, qty, type) {
  if (!part) return "";
  const w = warehouseById(part.warehouseId);
  const q = toInt(qty, 0);
  const out = type === "out";
  const after = out ? part.qty - q : part.qty + q;
  const over = out && q > part.qty;
  return '<span>当前库存 <b>' + n(part.qty) + " " + esc(part.unit) + "</b></span>" +
    "<span>" + esc(w ? w.no + " · " + w.name : "库房已删除") + "</span>" +
    (q > 0
      ? '<span class="' + (over ? "stock-over" : "") + '">' + (out ? "出库后 " : "入库后 ") +
        "<b>" + n(after) + " " + esc(part.unit) + "</b></span>"
      : "");
}
function viewLog() {
  const head =
    '<header class="page-head"><div class="page-title"><h1>登记</h1><p class="sub">现场登记，提交后台账与明细同时更新</p></div></header>';
  if (!data.parts.length) {
    return '<section class="page">' + head +
      '<div class="empty"><p>还没有可登记的备件。先建库房，再逐个建备件。</p>' +
      '<button type="button" class="btn btn-secondary" data-act="goLedger">去建台账</button></div></section>';
  }
  if (!partById(ui.regPart)) ui.regPart = sortedParts()[0].id;
  ui.regType = ui.regType === "out" ? "out" : "in";
  const part = partById(ui.regPart);
  const type = ui.regType;

  return '<section class="page">' + head +
    '<form id="logForm" class="card log-form" novalidate autocomplete="off">' +
      '<div class="field"><label for="logPart">备件</label>' +
        '<div class="select-wrap"><select class="input" id="logPart">' + partOptionsHTML(part.id) + "</select></div>" +
        '<div class="stock-line" id="logStockLine">' + stockLineHTML(part, "", type) + "</div>" +
      "</div>" +
      '<div class="field"><label id="logTypeLabel">类型</label>' +
        '<div class="seg" role="radiogroup" aria-labelledby="logTypeLabel">' +
          '<label><input type="radio" name="logType" value="in"' + (type !== "out" ? " checked" : "") + "><span>入库</span></label>" +
          '<label><input type="radio" name="logType" value="out"' + (type === "out" ? " checked" : "") + "><span>出库</span></label>" +
        "</div>" +
      "</div>" +
      '<div class="grid2">' +
        '<div class="field"><label for="logQty" id="logQtyLabel">数量（' + esc(part.unit) + '）</label>' +
          '<input class="input" id="logQty" type="number" min="1" step="1" inputmode="numeric" placeholder="正整数"></div>' +
        '<div class="field"><label for="logOperator">经办人</label>' +
          '<input class="input" id="logOperator" maxlength="20" placeholder="经办人" value="' + esc(data.settings.operator) + '"></div>' +
      "</div>" +
      '<div class="grid2">' +
        '<div class="field"><label for="logDate">日期</label><input class="input" id="logDate" type="date" value="' + today() + '"></div>' +
        '<div class="field"><label for="logNote">备注</label><input class="input" id="logNote" maxlength="60" placeholder="去向、领用人、单据"></div>' +
      "</div>" +
      '<div class="form-error" id="logError" role="alert"></div>' +
      '<div class="card-foot"><button type="submit" class="btn btn-primary submit-dock" id="logSubmit">' +
        (type === "out" ? "确认出库" : "确认入库") + "</button></div>" +
    "</form>" +
  "</section>";
}
function updateLogStockLine(form) {
  const part = partById(form.querySelector("#logPart").value);
  const typeEl = form.querySelector('input[name="logType"]:checked');
  const type = typeEl ? typeEl.value : "in";
  const qty = form.querySelector("#logQty").value;

  const line = form.querySelector("#logStockLine");
  if (line) line.innerHTML = stockLineHTML(part, qty, type);
  const qtyLabel = form.querySelector("#logQtyLabel");
  if (qtyLabel) qtyLabel.textContent = "数量（" + (part ? part.unit : "个") + "）";
  const btn = form.querySelector("#logSubmit");
  if (btn) btn.textContent = type === "out" ? "确认出库" : "确认入库";

  const err = form.querySelector("#logError");
  if (!err) return;
  err.textContent = "";
  const q = toInt(qty, 0);
  if (part && type === "out" && q > part.qty) {
    err.textContent = part.qty > 0
      ? "库存不足：当前 " + part.qty + " " + part.unit + "，最多可出 " + part.qty + " " + part.unit
      : "当前库存为 0，请先入库再出库";
  }
}
function bindLogForm(form) {
  form.querySelector("#logQty").addEventListener("input", () => updateLogStockLine(form));
  form.querySelector("#logPart").addEventListener("change", e => {
    ui.regPart = e.target.value;
    updateLogStockLine(form);
  });
  form.querySelectorAll('input[name="logType"]').forEach(el => {
    el.addEventListener("change", () => {
      const checked = form.querySelector('input[name="logType"]:checked');
      ui.regType = checked ? checked.value : "in";
      updateLogStockLine(form);
    });
  });
  form.addEventListener("submit", e => {
    e.preventDefault();
    const err = form.querySelector("#logError");
    err.textContent = "";
    try {
      const log = addStockLog({
        partId: form.querySelector("#logPart").value,
        type: form.querySelector('input[name="logType"]:checked').value,
        qty: form.querySelector("#logQty").value,
        operator: form.querySelector("#logOperator").value,
        date: form.querySelector("#logDate").value,
        note: form.querySelector("#logNote").value
      });
      form.querySelector("#logQty").value = "";
      form.querySelector("#logNote").value = "";
      updateLogStockLine(form);
      toast((log.type === "in" ? "已入库 " : "已出库 ") + n(log.qty) + " " + log.part.unit + "，结存 " + n(log.balance) + " " + log.part.unit);
    } catch (ex) {
      err.textContent = ex.message;
    }
  });
}
function mountView() {
  const form = document.getElementById("logForm");
  if (form) bindLogForm(form);
}

function logWarehouseId(log) {
  const p = partById(log.partId);
  if (p) return p.warehouseId;
  const w = data.warehouses.find(x => x.no === log.part.warehouseNo);
  return w ? w.id : "";
}
function filteredLogs() {
  const q = ui.logQ.trim().toLowerCase();
  return sortedLogs().filter(l => {
    if (ui.logPart && l.partId !== ui.logPart) return false;
    if (ui.logType && l.type !== ui.logType) return false;
    if (ui.logWh && logWarehouseId(l) !== ui.logWh) return false;
    if (ui.logFrom && String(l.date) < ui.logFrom) return false;
    if (ui.logTo && String(l.date) > ui.logTo) return false;
    if (!q) return true;
    const wh = logWarehouseId(l);
    const hay = [
      logTitle(l), logModel(l), l.operator, l.note,
      l.part.warehouseNo, wh ? warehouseLabel(wh) : "",
      l.type === "in" ? "入库" : "出库"
    ].join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  });
}
function logsPageSize() {
  return Math.max(1, toInt(data.settings.pageSize, 20) || 20);
}
function logWhOptionsHTML() {
  return '<option value="">全部库房</option>' + sortedWarehouses().map(w =>
    '<option value="' + esc(w.id) + '"' + (ui.logWh === w.id ? " selected" : "") + ">" + esc(w.no) + " · " + esc(w.name) + "</option>"
  ).join("");
}
function activeLogFiltersHTML() {

function logFilterOn() {

}

function confirmReverse(log) {
  if (!isAdmin()) return toast("当前是只读模式，不能修改数据", "error");
  if (log.kind === "reversal") return toast("冲正记录不能再冲正", "error");
  if (findReversalOf(log.id)) return toast("这笔明细已经冲正过", "error");
  const part = partById(log.partId);
  if (!part) return toast("备件已删除，无法冲正", "error");

  const unit = log.part.unit || part.unit || "";
  const srcText = (log.type === "in" ? "入库 " : "出库 ") + n(log.qty) + " " + unit;
  const backText = log.type === "in" ? "出库" : "入库";
  const after = log.type === "in" ? part.qty - log.qty : part.qty + log.qty;

  if (log.type === "in" && log.qty > part.qty) {
    openModal({
      title: "不能冲正",
      body: "<p>这笔入库 " + n(log.qty) + " " + esc(unit) + "，当前库存只有 " + n(part.qty) + " " + esc(part.unit) + "，冲正会让库存变成负数。</p>" +
        '<p style="margin-bottom:0">库存不足，需先补入库再冲正。</p>',
      actions: [{ label: "知道了", kind: "secondary" }]
    });
    return;
  }

  openModal({
    title: "冲正记录",
    body: "<p>将「" + esc(logTitle(log)) + "」的" + esc(srcText) + "整笔冲销，生成一笔反向" + backText +
      "记录，原记录保留不变，备注自动写「冲正 #原明细 id」。</p>" +
      '<p style="margin-bottom:0">冲正后库存 ' + n(after) + " " + esc(part.unit) + "。</p>",
    actions: [
      { label: "保留记录", kind: "secondary" },
      { label: "确认冲正", kind: "primary", onClick: () => {
        try {
          const r = reverseLog(log.id);
          render();
          toast("已冲正，结存 " + n(r.balance) + " " + (r.part.unit || ""));
        } catch (ex) {
          toast(ex.message, "error");
          return true;
        }
      } }
    ]
  });
}

   弹层：导入 / 导出 / 恢复 / 清空
   ========================================================= */
function openImportDialog() {
  const body =
    '<p>选择共享包文件（单个 JSON）。导入会整包覆盖本机数据，导入前自动备份上一份。</p>' +
    '<label class="btn btn-primary btn-block file-btn" tabindex="0" role="button">选择共享包文件<input type="file" id="importFile" accept=".json,application/json" hidden></label>' +
    '<div class="form-error" role="alert"></div>' +
    '<p style="margin-top:12px;margin-bottom:0">只读端导入后仍是只读，页面顶部会显示来源与导出时间。</p>';

  openModal({
    title: data.source && !isAdmin() ? "更新数据" : "导入共享包",
    body,
    actions: [{ label: "返回", kind: "secondary" }],
    onMount: modalEl => {
      wireFileLabel(modalEl.querySelector(".file-btn"));
      const input = modalEl.querySelector("#importFile");
      const err = modalEl.querySelector(".form-error");
      input.addEventListener("change", () => {
        const f = input.files && input.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const pkg = JSON.parse(String(reader.result));
            importPackage(pkg);
            render();
            toast("共享包已导入，整包覆盖完成");
            closeModal();
          } catch (ex) {
            err.textContent = ex.message || "共享包读取失败";
          }
        };
        reader.onerror = () => { err.textContent = "文件读取失败"; };
        reader.readAsText(f);
      });
    }
  });
}
function doExport() {
  try {
    const pkg = buildPackage();
    downloadFile("备件库房共享包-" + fileStamp() + ".json", JSON.stringify(pkg, null, 2));
    toast("共享包已导出");
  } catch (ex) {
    toast("导出失败：" + ex.message, "error");
  }
}
function openRestoreDialog() {
  if (!isAdmin()) return toast("先进入管理模式再恢复备份", "error");
  let saved = "";
  try {
    const raw = localStorage.getItem(KEYS.bak);
    if (raw) saved = fmtStamp(JSON.parse(raw).savedAt);
  } catch (e) {}
  openModal({
    title: "恢复导入前备份",
    body: "<p>用 " + esc(saved || "未知时间") + " 的备份覆盖当前数据，当前数据会被替换。恢复后建议立即导出共享包。</p>",
    actions: [
      { label: "保留当前数据", kind: "secondary" },
      { label: "恢复备份", kind: "danger", onClick: () => {
        try {
          const raw = localStorage.getItem(KEYS.bak);
          if (!raw) throw new Error("没有可恢复的备份");
          const bak = JSON.parse(raw);
          if (!bak || !bak.data) throw new Error("备份内容已损坏");
          data = normalize(bak.data);
          if (!saveData()) throw new Error("恢复后保存失败");
          render();
          toast("已恢复到导入前的备份");
        } catch (ex) {
          toast(ex.message, "error");
          return true;
        }
      } }
    ]
  });
}
function clearAll() {
  try {
    localStorage.removeItem(KEYS.data);
    localStorage.removeItem(KEYS.pin);
    localStorage.removeItem(KEYS.bak);
    sessionStorage.removeItem(KEYS.admin);
  } catch (e) {}
  data = null;
}
function openClearDialog(step) {
  if (step === 2) {
    openModal({
      title: "再次确认清空",
      body: "<p>清空后本机数据无法恢复，只能通过导入之前导出的共享包重建。</p>",
      actions: [
        { label: "返回", kind: "secondary" },
        { label: "确认清空", kind: "danger", onClick: () => {
          clearAll();
          render();
          toast("本机数据已清空");
        } }
      ]
    });
    return;
  }
  openModal({
    title: "清空本机数据",
    body: "<p>会删除本机的库房、台账、出入库明细和 PIN。这个动作无法撤销。</p>",
    actions: [
      { label: "保留数据", kind: "secondary" },
      { label: "继续清空", kind: "danger", onClick: () => { setTimeout(() => openClearDialog(2), 0); } }
    ]
  });
}

/* =========================================================
   事件
   ========================================================= */
const handlers = {
  addPart: () => openPartDialog(null),
  openPart: el => openPartDetail(el.dataset.id),
  partLogs: el => { closeModal(); showPartLogs(el.dataset.id); },
  addWarehouse: () => openWarehouseDialog(null),
  editWarehouse: el => openWarehouseDialog(el.dataset.id),
  deleteWarehouse: el => { const w = warehouseById(el.dataset.id); if (w) confirmDeleteWarehouse(w); },
  reverseLog: el => { const l = data.logs.find(x => x.id === el.dataset.id); if (l) confirmReverse(l); },
  clearFilters: () => { ui.q = ""; ui.wh = ""; ui.cat = ""; render(); const q = document.getElementById("q"); if (q) q.focus(); },
  clearLogFilters: () => {
    ui.logQ = ""; ui.logType = ""; ui.logWh = ""; ui.logFrom = ""; ui.logTo = ""; ui.logPart = "";
    ui.logLimit = logsPageSize();
    render();
    const q = document.getElementById("logQ");
    if (q) q.focus();
  },
  moreLogs: () => { ui.logLimit += logsPageSize(); updateLogsBody(); },
  goLedger: () => { ui.view = "ledger"; render(); },
  enterAdmin: () => openEnterAdminDialog(),
  exitAdmin: () => { setAdmin(false); render(); toast("已退出管理模式"); },
  setupPin: () => openSetupPinDialog(),
  changePin: () => openChangePinDialog(),
  forgotPin: () => { closeModal(); openClearDialog(1); },
  importPkg: () => openImportDialog(),
  exportPkg: () => doExport(),
  exportLedger: () => exportLedgerCsv(),
  exportLogs: () => openLogsCsvDialog(),
  restoreBak: () => openRestoreDialog(),
  clearData: () => openClearDialog(1)
};

document.addEventListener("click", e => {
  const navEl = e.target.closest("[data-nav]");
  if (navEl) {
    ui.view = navEl.dataset.nav;
    render();
    const h = document.querySelector("#view h1");
    if (h) h.focus();
    window.scrollTo(0, 0);
    return;
  }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = handlers[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[data-act][role="button"]')) {
    e.preventDefault();
    e.target.click();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") {
    ui.q = e.target.value;
    updateLedgerBody();
  }
  if (e.target.id === "logQ") {
    ui.logQ = e.target.value;
    ui.logLimit = logsPageSize();
    updateLogsBody();
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "filterWh") { ui.wh = e.target.value; updateLedgerBody(); }
  if (e.target.id === "filterCat") { ui.cat = e.target.value; updateLedgerBody(); }
  if (e.target.id === "logFilterType") { ui.logType = e.target.value; ui.logLimit = logsPageSize(); updateLogsBody(); }
  if (e.target.id === "logFilterWh") { ui.logWh = e.target.value; ui.logLimit = logsPageSize(); updateLogsBody(); }
  if (e.target.id === "logFrom") { ui.logFrom = e.target.value; ui.logLimit = logsPageSize(); updateLogsBody(); }
  if (e.target.id === "logTo") { ui.logTo = e.target.value; ui.logLimit = logsPageSize(); updateLogsBody(); }
});

/* =========================================================
   PWA（仅 http(s)）
   file:// 下不注入 manifest、不注册 SW，保证零网络请求
   ========================================================= */
function initPwa() {
  if (location.protocol !== "http:" && location.protocol !== "https:") return;
  const addLink = (rel, href) => {
    const l = document.createElement("link");
    l.rel = rel;
    l.href = href;
    document.head.appendChild(l);
  };
  addLink("manifest", "manifest.webmanifest");
  addLink("apple-touch-icon", "assets/logo-v3-180.png");
  if (!("serviceWorker" in navigator)) return;

  let asked = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (asked) { asked = false; location.reload(); }
  });
  const askUpdate = reg => {
    if (asked) return;
    asked = true;
    openModal({
      title: "有新版本可用",
      body: "<p>新版本已下载完成，刷新后生效。本机台账与明细不会受影响。</p>",
      actions: [
        { label: "稍后", kind: "secondary" },
        { label: "立即刷新", kind: "primary", onClick: () => {
          if (reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
          else location.reload();
        } }
      ]
    });
  };
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      if (reg.waiting) askUpdate(reg);
      reg.addEventListener("updatefound", () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", () => {
          if (sw.state === "installed" && navigator.serviceWorker.controller) askUpdate(reg);
        });
      });
    }).catch(() => {});
  });
}

/* =========================================================
   启动
   ========================================================= */
data = loadData();
render();
initPwa();
</script>
